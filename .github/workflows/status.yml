name: 4H status (after each 4H close)
on:
  schedule:
    - cron: '5,35 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: status, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -q -r requirements.txt
      - run: STATE_FILES=status.json ci/state.sh pull
      - run: python signal.py --status
      - if: always()
        run: STATE_FILES=status.json ci/state.sh push
