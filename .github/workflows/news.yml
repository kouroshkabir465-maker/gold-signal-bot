name: Daily news 07:00 Istanbul
on:
  schedule:
    - cron: '47 3 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Skip if already sent today
        id: dup
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          today=$(TZ=Europe/Istanbul date +%F)
          n=$(gh run list -R ${{ github.repository }} -w news.yml -s success -L 10 --json createdAt -q '.[].createdAt' | while read t; do TZ=Europe/Istanbul date -d "$t" +%F; done | grep -c "^$today$" || true)
          echo "n=$n" >> $GITHUB_OUTPUT
      - if: steps.dup.outputs.n == '0' || github.event_name == 'workflow_dispatch'
        run: python news.py
