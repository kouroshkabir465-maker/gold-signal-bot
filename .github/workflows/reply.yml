name: Reply to Telegram message
on:
  repository_dispatch:
    types: [tg_message]
  workflow_dispatch:
    inputs:
      text: { description: "message text", default: "/check" }
permissions:
  contents: write   # asia_box.py: save per-user on/off to the state branch (asia_prefs.json only)
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MPLCONFIGDIR: /tmp/mpl
      TG_TEXT: ${{ github.event.client_payload.text || inputs.text }}
      TG_CHAT: ${{ github.event.client_payload.chat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Asian-session buttons (isolated add-on; never blocks the normal reply)
        continue-on-error: true
        timeout-minutes: 3
        env: { ASIA_CHAT: "${{ github.event.client_payload.chat }}" }
        run: ci/asia_state.sh pull && python asia_box.py --reply && ci/asia_state.sh push asia_prefs.json
      - run: python listener.py --reply
